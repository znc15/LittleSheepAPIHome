name: Deploy to Tencent EdgeOne

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          if [ -z "${{ secrets.EDGEONE_API_TOKEN }}" ]; then
            echo "Missing secret: EDGEONE_API_TOKEN"
            exit 1
          fi
          if [ -z "${{ secrets.EDGEONE_PROJECT_NAME }}" ]; then
            echo "Missing secret: EDGEONE_PROJECT_NAME"
            exit 1
          fi

      - name: Deploy to EdgeOne Pages
        uses: TencentEdgeOne/edgeone-pages-action@v1
        with:
          token: ${{ secrets.EDGEONE_API_TOKEN }}
          project-name: ${{ secrets.EDGEONE_PROJECT_NAME }}
          build-path: .
